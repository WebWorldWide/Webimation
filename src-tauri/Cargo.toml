[package]
name = "webimation"
version = "0.1.0"
description = "Webimation: motion graphics for YouTube"
authors = ["Web World Wide"]
license = ""
repository = "https://github.com/WebWorldWide/Webimation"
edition = "2024"
rust-version = "1.90"

[lib]
name = "webimation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
wcore = { path = "crates/wcore" }
rayon = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The engine is the hot path: optimise it even in dev builds so previews and exports stay fast.
[profile.dev.package.wcore]
opt-level = 3

[workspace]
members = [".", "crates/wcore"]
