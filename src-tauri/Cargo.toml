[package]
name = "webimation"
version = "0.1.0"
description = "Webimation: motion graphics for YouTube"
authors = ["Web World Wide"]
license = ""
repository = "https://github.com/WebWorldWide/Webimation"
edition = "2024"
rust-version = "1.90"

[lib]
name = "webimation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
