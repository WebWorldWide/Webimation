[package]
name = "wcore"
version = "0.1.0"
edition = "2021"
description = "Webimation native engine: every frame is a pure function of time"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["parallel"]
# Multi-threaded frame rendering (native only; wasm32 builds without it).
parallel = ["dep:rayon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
png = "0.17"
rayon = { version = "1", optional = true }
